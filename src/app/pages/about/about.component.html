<!-- src/app/pages/about/about.component.html -->

<section class="about-hero section" aria-labelledby="about-heading">
  <div class="container about-hero__inner">

    <div class="about-hero__text">
      <p class="about-hero__eyebrow">{{ ui.sectionLabel }}</p>
      <h1 id="about-heading">{{ config.agentName }}</h1>
      <div class="about-hero__rich-text" [innerHTML]="config.richTextAbout" aria-label="Agent biography"></div>
    </div>

    <aside class="about-hero__sidebar">
      <div class="about-hero__photo-wrap">
        <img [ngSrc]="config.secondaryProfilePictureUrl || config.profilePictureUrl"
             [alt]="config.secondaryProfilePictureAlt || config.profilePictureAlt"
             width="420" height="500" class="about-hero__photo" />
      </div>

      <div class="about-credentials">
        <h2 class="about-credentials__heading">{{ ui.credentialsHeading }}</h2>
        <ul class="about-credentials__list" role="list">
          @for (licence of config.licences; track licence) {
            <li class="about-credentials__item">
              <svg class="about-credentials__check" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              {{ licence }}
            </li>
          }
        </ul>
      </div>
    </aside>

  </div>
</section>

<section class="about-contact section section--alt" aria-labelledby="about-contact-heading">
  <div class="container">
    <h2 id="about-contact-heading">{{ ui.contactHeading }}</h2>
    <p class="about-contact__copy">{{ ui.contactCopy }}</p>
    <app-quick-contact-bar />
  </div>
</section>
