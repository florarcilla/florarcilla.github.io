<!-- src/app/pages/enquire/enquire.component.html -->

<section class="enquire section" aria-labelledby="enquire-heading">
  <div class="container enquire__inner">

    <div class="enquire__intro">
      <h1 id="enquire-heading">{{ ui.heading }}</h1>
      <p class="enquire__copy">{{ config.enquiryFormIntro }}</p>

      <app-quick-contact-bar />

      <div class="enquire__contact-details">
        <a class="enquire__contact-link" [href]="'tel:' + config.phone" [attr.aria-label]="'Call ' + config.agentName" (click)="trackPhone()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 2.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.06 6.06l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 17z"/>
          </svg>
          {{ config.phone }}
        </a>

        <!-- Email opens service-picker modal instead of bare mailto -->
        <button
          class="enquire__contact-link enquire__contact-link--btn"
          type="button"
          (click)="openEmailModal()"
          [attr.aria-label]="'Email ' + config.agentName"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          {{ config.email }}
        </button>
      </div>
    </div>

    <div class="enquire__form" #formSection>
      <app-enquiry-form
        [defaultType]="defaultType()"
        [prefillMessage]="prefillMessage()"
        [autoFocus]="autoFocus()"
      />
    </div>

  </div>
</section>

<!-- ── Email service-picker modal ─────────────────────────────────────────────── -->
@if (emailModalOpen()) {
  <div
    class="email-modal-backdrop"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="modalUi.title"
    (click)="closeEmailModal()"
    (keydown.escape)="closeEmailModal()"
  >
    <div class="email-modal" (click)="$event.stopPropagation()">

      <div class="email-modal__icon" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </div>

      <h2 class="email-modal__title">{{ modalUi.title }}</h2>
      <p class="email-modal__subtitle">{{ modalUi.subtitle }}</p>

      <div class="email-modal__options">

        <button class="email-modal__option" type="button" (click)="selectEmailService('insurance')">
          <span class="email-modal__option-icon email-modal__option-icon--insurance" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </span>
          {{ modalUi.insurance }}
          <svg class="email-modal__option-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>

        <button class="email-modal__option" type="button" (click)="selectEmailService('realestate')">
          <span class="email-modal__option-icon email-modal__option-icon--realestate" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </span>
          {{ modalUi.realestate }}
          <svg class="email-modal__option-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>

      </div>

      <button class="email-modal__cancel" type="button" (click)="closeEmailModal()">
        {{ modalUi.cancel }}
      </button>

    </div>
  </div>
}
