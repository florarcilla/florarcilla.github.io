<!-- src/app/shared/components/testimonial-card/testimonial-card.component.html -->
<article class="testimonial-card">
  <div class="testimonial-card__header">
    <img
      [ngSrc]="testimonial.avatarUrl"
      [alt]="testimonial.avatarAlt"
      width="48"
      height="48"
      class="testimonial-card__avatar"
    />
    <div class="testimonial-card__meta">
      <p class="testimonial-card__name">{{ testimonial.name }}</p>
      <app-star-rating [rating]="testimonial.rating" />
    </div>
  </div>

  <blockquote class="testimonial-card__text">
    <p>{{ testimonial.text }}</p>
  </blockquote>

  @if (testimonial.date) {
    <time class="testimonial-card__date">{{ testimonial.date }}</time>
  }
</article>
