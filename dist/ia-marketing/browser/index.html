<!doctype html>
<!-- src/index.html -->
<html lang="en" data-theme="light">
  <head><base href="/">
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <!--
      Core meta tags are set at runtime by SeoService (src/app/core/services/seo.service.ts)
      using values from app.config.{lang}.json — so every page, in every language,
      gets the correct title, description, keywords, og:*, twitter:* and canonical.
      The tags below are static fallbacks for crawlers that arrive before JS runs.
    -->

    <!-- ── Static fallbacks (overwritten by SeoService on first navigation) ── -->
    <title>Flor D. Arcilla – Insurance Agent &amp; Real Estate Sales Associate Philippines</title>
    <meta name="description" content="Flor D. Arcilla helps Filipino families and OFWs protect their future with PruLife UK insurance and invest in real estate through ProFriends properties across the Philippines."/>
    <meta name="keywords" content="Life Insurance Philippines, PruLife UK, insurance agent Philippines, real estate Philippines, ProFriends, Pasalo property, OFW insurance, OFW real estate, VUL Philippines, Pag-IBIG loan, pre-selling condo Philippines, Flor Arcilla"/>
    <meta name="author" content="Flor D. Arcilla"/>
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"/>
    <meta name="theme-color" content="#7459ca"/>

    <!-- Geo signals -->
    <meta name="geo.region" content="PH"/>
    <meta name="geo.country" content="Philippines"/>
    <meta name="geo.placename" content="Philippines"/>
    <meta name="ICBM" content="12.8797, 121.7740"/>

    <!-- ── Open Graph ──────────────────────────────────────────────────────── -->
    <meta property="og:type" content="website"/>
    <meta property="og:site_name" content="Flor D. Arcilla"/>
    <meta property="og:title" content="Flor D. Arcilla – Insurance Agent &amp; Real Estate Sales Associate Philippines"/>
    <meta property="og:description" content="Flor D. Arcilla helps Filipino families and OFWs protect their future with PruLife UK insurance and invest in real estate through ProFriends properties across the Philippines."/>
    <meta property="og:url" content="https://florarcilla.com/"/>
    <meta property="og:image" content="https://florarcilla.com/assets/images/flor_banner.jpg"/>
    <meta property="og:image:width" content="1200"/>
    <meta property="og:image:height" content="630"/>
    <meta property="og:image:alt" content="Flor D. Arcilla, licensed insurance agent and real estate sales associate"/>
    <meta property="og:locale" content="en_PH"/>

    <!-- ── Twitter / X Card ────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:site" content="@florarcilla"/>
    <meta name="twitter:creator" content="@florarcilla"/>
    <meta name="twitter:title" content="Flor D. Arcilla – Insurance Agent &amp; Real Estate Sales Associate Philippines"/>
    <meta name="twitter:description" content="Flor D. Arcilla helps Filipino families and OFWs protect their future with PruLife UK insurance and invest in real estate through ProFriends properties."/>
    <meta name="twitter:image" content="https://florarcilla.com/assets/images/flor_banner.jpg"/>
    <meta name="twitter:image:alt" content="Flor D. Arcilla, licensed insurance agent and real estate sales associate"/>

    <!-- ── Canonical + hreflang ────────────────────────────────────────────── -->
    <link rel="canonical" href="https://florarcilla.com/"/>
    <link rel="alternate" hreflang="en" href="https://florarcilla.com/"/>
    <link rel="alternate" hreflang="tl" href="https://florarcilla.com/"/>
    <link rel="alternate" hreflang="ceb" href="https://florarcilla.com/"/>
    <link rel="alternate" hreflang="zh-CN" href="https://florarcilla.com/"/>
    <link rel="alternate" hreflang="x-default" href="https://florarcilla.com/"/>

    <!-- ── Favicon & web manifest ───────────────────────────────────────────── -->
    <link rel="icon" type="image/x-icon" href="favicon.ico"/>
    <link rel="icon" type="image/svg+xml" href="assets/images/flor_logo.svg"/>
    <link rel="apple-touch-icon" href="assets/images/flor_logo.png"/>
    <link rel="manifest" href="site.webmanifest"/>

    <!-- ── Critical resource preloads ─────────────────────────────────────── -->
    <!--
      LCP hero image: static href here + static src in the <img> tag let Lighthouse
      (and the browser) discover the request before any JavaScript executes.
      Both must reference the exact same URL — no Angular binding, no redirect.
    -->
    <link rel="preload" as="image" href="assets/images/flor_banner.webp" type="image/webp" fetchpriority="high"/>
    <!-- Config JSON: starts fetching before Angular boots, shortening the init chain -->
    <link rel="preload" as="fetch" href="assets/config/app.config.en.json" crossorigin="anonymous"/>

    <!-- ── Google Fonts ─────────────────────────────────────────────────────── -->
    <!--
      DM Sans (body): display=swap — brief invisible flash is acceptable for body text.
      Playfair Display (logo SVG text): display=optional — prevents font-swap from
      causing CLS in the footer logo. On first visit the fallback font is used;
      on repeat visits (font cached) Playfair renders immediately.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>

    <!-- DM Sans — body font, swap is fine -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&amp;display=swap"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&amp;display=swap" media="print" onload="this.media='all'"/>

    <!-- Playfair Display — logo only, optional prevents font-swap CLS -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&amp;display=optional"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&amp;display=optional" media="print" onload="this.media='all'"/>

    <noscript>
      <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:wght@900&display=swap" />
    </noscript>

    <!-- JSON-LD structured data injected at runtime by AppComponent -->

    <!-- ── Google Analytics 4 ───────────────────────────────────────────────── -->
    <script async="" src="https://www.googletagmanager.com/gtag/js?id=G-HWV9P7HC36"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-HWV9P7HC36');
    </script>

    <!--
      SPA routing on GitHub Pages: 404.html encodes the requested path as ?p=
      and redirects here. This script decodes it and restores the correct URL
      via history.replaceState before Angular boots, so the router sees the
      right path without a full page reload.
    -->
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p) {
          var q = params.get('q');
          var base = window.location.pathname.replace(/\/$/, '');
          window.history.replaceState(
            null, null,
            base + p +
            (q ? '?' + q.replace(/~and~/g, '&') : '') +
            window.location.hash
          );
        }
      })();
    </script>
  <link rel="stylesheet" href="styles.css"></head>
  <body>
    <app-root></app-root>
  <link rel="modulepreload" href="chunk-CEKISYYO.js"><link rel="modulepreload" href="chunk-P2MAUDGB.js"><link rel="modulepreload" href="chunk-MNI4DMSU.js"><script src="polyfills.js" type="module"></script><script src="main.js" type="module"></script></body>
</html>
