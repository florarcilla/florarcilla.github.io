<!doctype html>
<!-- 404.html — GitHub Pages SPA fallback -->
<!--
  GitHub Pages serves this file for any path that doesn't match a static file.
  The script encodes the current path into a query param and redirects to the
  app root. The decode script in index.html reads it back and calls
  history.replaceState so Angular's router sees the original path.

  segmentCount = 0 // 0 = custom domain (florarcilla.com); use 1 for GitHub project pages (username.github.io/repo)  for a project page  (username.github.io/repo-name/)
  segmentCount = 0  for a custom domain (florarcilla.com/)
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Flor D. Arcilla - Insurance Agent &amp; Real Estate Sales Associate</title>
    <script>
      var segmentCount = 0 // 0 = custom domain (florarcilla.com); use 1 for GitHub project pages (username.github.io/repo);

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>Redirecting...</body>
</html>
