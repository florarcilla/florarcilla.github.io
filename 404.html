<!doctype html>
<!-- 404.html — GitHub Pages SPA fallback -->
<!--
  GitHub Pages serves this file for any path that doesn't match a real file.
  The script below extracts the path + query from the URL, encodes it into
  the query string of the root URL, then redirects there. The index.html
  redirect script (below) decodes it and restores the original URL via
  history.replaceState so the Angular router sees the correct path.

  Credit: https://github.com/rafgraph/spa-github-pages
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Maria Santos – Insurance Agent &amp; Real Estate Sales Associate</title>
    <script>
      var segmentCount = 1; // set to 0 for a user-org page, 1 for a project page

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>Redirecting…</body>
</html>
